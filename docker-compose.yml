version: "3.8"

# All services bind to 127.0.0.1 only.
# Required env vars: REDIS_PASSWORD (set in .env)
# Run with: docker compose --env-file .env up

services:
  redis:
    image: redis:7-alpine
    ports:
      # Localhost-only bind. Use SSH/Tailscale tunnel for remote access.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --protected-mode yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

